<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoForest: Heal the Grove</title>
<style>

*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr 330px;align-items:start}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{margin:0;font-size:1.6rem}
header p{margin:0;color:var(--muted);font-size:.95rem}
#stage{--c:1;position:relative;isolation:isolate;height:min(68vh,560px);min-height:380px;border-radius:26px;overflow:hidden;border:3px solid var(--line);
background:linear-gradient(#9fe0f5,#e8f9e4 70%);user-select:none;-webkit-user-select:none}
.sun{position:absolute;top:34px;right:60px;width:70px;height:70px;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 14px #ffe27a55}
.cloud{position:absolute;height:26px;width:90px;background:#fff;border-radius:20px;opacity:.9;animation:drift 60s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:40px;height:40px;left:12px;top:-20px}.cloud:after{width:30px;height:30px;left:46px;top:-12px}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(1200px)}}
.hill{position:absolute;border-radius:50% 50% 0 0}
.h1{left:-10%;bottom:18%;width:70%;height:42%;background:#8fd69a}
.h2{right:-15%;bottom:18%;width:75%;height:50%;background:#79c98a}
.ground{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#6cc47a,#58b368)}
.flower{position:absolute;bottom:4%;font-size:18px}
.blight{position:absolute;inset:0;pointer-events:none;opacity:calc(var(--c)*.5);mix-blend-mode:multiply;
background:radial-gradient(circle at 50% 100%,#e0364a,#a3122a 85%)}
.mist{position:absolute;inset:0;pointer-events:none;opacity:calc(var(--c)*.35);background:linear-gradient(transparent 40%,#ff4a5e)}
.tree{position:absolute;cursor:pointer;-webkit-tap-highlight-color:transparent;width:clamp(90px,15%,150px);transform-origin:bottom center}

@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes rustle{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) scale(1.03)}35%{transform:rotate(6deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
.tree.rustle .canopy{animation:rustle .5s ease}
.blot{opacity:calc(var(--c)*.85)}
.tree:focus-visible{outline:3px dashed var(--ok);outline-offset:4px;border-radius:12px}
.leaf{position:absolute;width:30px;height:30px;pointer-events:none;animation:fall var(--t,2.2s) ease-in forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(35px,calc(var(--d)*.3)) rotate(120deg)}
60%{transform:translate(-28px,calc(var(--d)*.6)) rotate(240deg)}100%{transform:translate(10px,var(--d)) rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;
border:2px solid var(--line);font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.toast{z-index:300}
.leaf{z-index:250}
.scn{position:absolute;left:0;width:100%;pointer-events:none}
.front{z-index:200;filter:hue-rotate(calc(var(--c)*-75deg))}
.panel{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px}
.panel h2{margin:0 0 4px;font-size:1.15rem}
.status{margin:0 0 10px;color:var(--muted);font-size:.9rem;min-height:1.3em}
.bar{height:22px;border-radius:99px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;border:2px solid var(--line)}
.fill{height:100%;width:0;border-radius:99px;transition:width .6s ease,background-color .6s ease}
.pct{display:flex;justify-content:space-between;font-size:.85rem;margin:6px 2px 12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.task:hover{border-color:var(--ok)}

.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #d6293a;display:grid;place-items:center;color:#fff;font-size:14px;transition:.3s}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.task b{display:block;font-size:.95rem}
.task small{color:var(--muted);line-height:1.3;display:block}

.modal.on{display:grid}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;max-width:420px;width:100%;padding:24px;text-align:center;animation:pop .3s ease}

.card h3{margin:6px 0 8px;font-size:1.3rem}

.card button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{max-width:1200px;grid-template-columns:1fr}
.scene{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
#stage{--sp:1;height:min(80vh,660px);min-height:560px}

#vines{z-index:150}

.hud{top:30px;left:30px;right:30px}
.hud .bar{display:block;position:relative;overflow:hidden;padding:0;background:linear-gradient(90deg,#e8394d,#a3122a 50%,#7a2a9e)}
.hud .fill{position:relative;height:100%;width:0;border-radius:99px;background:linear-gradient(#8ae886,#3f9d5a);box-shadow:0 0 14px 3px #9af09acc;transition:width 1.2s cubic-bezier(.25,.8,.3,1)}
.hud .fill:after{content:'';position:absolute;right:0;top:0;bottom:0;width:28px;border-radius:99px;background:linear-gradient(90deg,transparent,#d4f9bcaa)}
#stage{background:linear-gradient(#78cdee 0%,#b4e6f0 35%,#f3f1c6 62%,#fde6b4 80%)}
.sun{top:64px;right:110px;width:84px;height:84px;background:radial-gradient(#fffbe0,#ffe27a 70%);box-shadow:0 0 0 16px #ffe27a44,0 0 70px 34px #fff3b0aa,0 0 160px 90px #ffe9a055}
.cloud2{position:absolute;pointer-events:none;width:110px;height:30px;border-radius:30px;background:#fff;opacity:.92;filter:drop-shadow(0 6px 4px #9fc9d84d);animation:drift2 var(--d) linear infinite;animation-delay:var(--dl)}
.cloud2:before,.cloud2:after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud2:before{width:52px;height:52px;left:14px;top:-26px}
.cloud2:after{width:38px;height:38px;left:56px;top:-17px}
@keyframes drift2{from{transform:translateX(-220px) scale(var(--s))}to{transform:translateX(1500px) scale(var(--s))}}
.rays{position:absolute;inset:0;pointer-events:none;z-index:120;background:repeating-conic-gradient(from 195deg at 88% -12%,#fff6c038 0 5deg,transparent 5deg 15deg);-webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%);opacity:calc(1 - var(--c)*.9);transform-origin:88% 0;animation:rayshift 9s ease-in-out infinite alternate}
@keyframes rayshift{to{transform:rotate(3deg)}}
.bf{position:absolute;left:0;top:0;width:24px;z-index:2000;pointer-events:none;opacity:calc(1 - var(--c)*1.3);will-change:transform}
.bf svg{display:block;overflow:visible}
.bf .wl,.bf .wr{transform-origin:12px 10px;animation:flap .18s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.25)}}

.dapple{position:absolute;left:0;right:0;bottom:0;height:24%;pointer-events:none;opacity:calc(1 - var(--c)*.7);background:radial-gradient(ellipse 70px 16px at 12% 52%,#fff6b855,transparent),radial-gradient(ellipse 90px 20px at 30% 70%,#fff6b844,transparent),radial-gradient(ellipse 60px 14px at 48% 45%,#fff6b855,transparent),radial-gradient(ellipse 100px 22px at 66% 66%,#fff6b844,transparent),radial-gradient(ellipse 70px 16px at 84% 50%,#fff6b855,transparent)}
#world{position:absolute;left:0;top:0;bottom:0;width:300%;z-index:100;pointer-events:none;will-change:transform}
.tree{width:var(--tw,130px);pointer-events:auto;animation:sway2 5s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes sway2{50%{transform:rotate(1.4deg)}}
.lay{position:absolute;left:0;display:flex;pointer-events:none;will-change:transform}
.nav{position:absolute;top:46%;transform:translateY(-50%);z-index:455;width:46px;height:46px;border-radius:50%;border:3px solid #6b4630;background:#8a5d38;color:#fff4dc;font:inherit;font-size:1.7rem;line-height:1;cursor:pointer;box-shadow:0 3px 8px #0005;display:grid;place-items:center;padding:0 0 4px}
.nav.l{left:30px}
.nav.r{right:46px}
.nav:hover{background:#9c6b42}
.nav:disabled{opacity:.35;cursor:default}
.nav:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mm{position:absolute;left:34px;bottom:20px;width:110px;height:8px;border-radius:99px;background:#10281ccc;z-index:455;pointer-events:none}
.mm i{position:absolute;top:0;bottom:0;width:36px;border-radius:99px;background:#9af09a;left:0}
.blight{mix-blend-mode:normal;opacity:calc(var(--c)*.3)}
#stage{--fx:saturate(calc(1.22 - var(--c)*.98)) sepia(calc(var(--c)*.4)) brightness(calc(1.04 - var(--c)*.28)) contrast(calc(1.05 - var(--c)*.12))}
#world,.lay{filter:var(--fx);transition:filter .8s}
.lay .front{filter:none}
.canopy>g[fill]:not(.bare),.canopy>path{opacity:calc(1 - var(--c)*.4)}
.bare{opacity:calc(var(--c)*.95)}
.gloom{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#4a3d46,#7d6460 55%,#a98a76);opacity:calc(var(--c)*.78)}
.sun{opacity:calc(1 - var(--c)*.5)}
.board{height:min(80vh,660px);min-height:560px;display:flex;flex-direction:column;overflow:auto;padding:12px;color:#3a2a1a;
background:repeating-linear-gradient(180deg,#b4824f 0 38px,#a47443 38px 40px);border:4px solid #6b4630;border-radius:18px;box-shadow:0 8px 18px #0005}
.board h2{margin:0 0 8px;font-size:1.05rem;color:#fff4dc;text-shadow:0 1px 2px #0006}
.board ul{gap:7px;flex:1}
.board .task{background:#f6ead0;border:2px solid #7a5232;border-radius:10px;padding:7px 9px;gap:8px;color:#3a2a1a}
.board .task:hover{border-color:#3f9d5a}
.board .task b{font-size:.88rem}
.board .task small{color:#6a5236;font-size:.74rem}
.board .task.done{background:#dff2cd;border-color:#3f9d5a}
.board .box{background:#fff;border-color:#c4182f;width:20px;height:20px}
.board .task.done .box{background:#3f9d5a;border-color:#3f9d5a}
.board .foot{color:#fff4dc;margin-top:10px}
.board .wk{margin:-4px 0 8px;font-size:.74rem;color:#fff4dc;opacity:.9}
.board .foot button{color:#fff4dc;border-color:#fff4dc88}
@media(max-width:820px){.scene{grid-template-columns:minmax(0,1fr) 190px;gap:8px}#stage,.board{height:480px;min-height:480px}.board{padding:8px}.board h2{font-size:.9rem}.board .task small{display:none}.board .task b{font-size:.78rem}}
@media(max-width:520px){.scene{grid-template-columns:minmax(0,1fr) 150px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<body>
<div class="app">
<header><h1>🌳 EcoForest</h1><p>Rustle the trees for tips. Do real eco tasks to heal the grove.</p></header>

<div class="scene">
<div id="stage">
  <div class="sun"></div>
  <div class="cloud" style="top:40px;left:0"></div>
  <div class="cloud" style="top:100px;left:-300px;animation-delay:-25s;transform:scale(.8)"></div>
  <div class="ground"></div>
  <div class="blight"></div><div class="mist"></div>
  <div id="world"></div>
  <div class="toast" id="toast"></div>
  <div class="hud"><div class="hudtop"><b>Forest health</b></div><div class="bar" id="bar"></div><div class="hudsub"><span id="status"></span><span id="count">0 of 8 tasks</span></div></div>
  <button class="nav l" id="navL" aria-label="Look left">&#8249;</button><button class="nav r" id="navR" aria-label="Look right">&#8250;</button><div class="mm"><i></i></div>
  <button class="tab" id="tab" aria-controls="board" aria-expanded="true">Hide tasks</button>
</div>

<aside class="board" id="board">
  <h2>🌿 Grove tasks</h2>
  <p class="wk" id="wk"></p>
  <ul id="tasks"></ul>
  <div class="foot"><span id="tips">Tips found: 0</span><button id="reset">Start over</button></div>
</aside>
</div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="card">
    <div id="micon" style="font-size:2.4rem">🍃</div>
    <h3 id="mt"></h3><p id="mp"></p>
    <button id="close">Close</button>
  </div>
</div>

<script>
const POOL=[
["Make an eco-brick","Stuff a clean, dry plastic bottle with soft plastic wrappers until it is rock hard."],
["Take a 5-minute shower","Set a timer. Short showers save litres of water and energy."],
["Tap off while brushing","Turn the water off while you scrub. Back on to rinse."],
["Reuse leftover water","Water plants with cooking water or the cup you didn't finish."],
["Carry a reusable bag or bottle","Skip one single-use bag or bottle today."],
["Unplug idle devices","Chargers and gadgets sip power even when nothing is connected."],
["Compost food scraps","Start or feed a compost bin instead of binning peels and cores."],
["Sort your recycling","Rinse containers and check local rules for what goes where."],
['Skip meat for one meal','Swap one meal for a plant-based one.'],
['Wash clothes cold','Cold cycles use far less energy.'],
['Hang laundry to dry','Skip the dryer for one load.'],
['Use a refillable cup','Say no to a disposable coffee cup.'],
['Fix a leaky tap','A dripping tap can waste thousands of litres a year.'],
['Plant a seed or sapling','Grow something in a pot, yard or community garden.'],
['Walk, bike or take transit','Swap one car trip for a greener one.'],
['Pick up litter','Collect ten pieces of trash on a walk.'],
['Repair instead of replace','Mend a tear, a button or a broken item.'],
['Switch off unused lights','Or swap one old bulb for an LED.'],
['Have a no-buy day','Skip any non-essential purchase today.'],
['Plan meals to cut food waste','Check the fridge, then write a shopping list.'],
['Reuse scrap paper','Use both sides before recycling.'],
['Unsubscribe from junk mail','Cancel one paper catalogue or flyer.'],
['Donate or swap an item','Give something you no longer use a second life.'],
['Set out a pollinator water dish','A shallow dish with pebbles helps bees and butterflies.']];
function weekId(){const n=new Date();return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(1970,0,5))/6048e5)}
const WEEK=weekId();
const TASKS=(()=>{const r=rnd(WEEK*7919+13),a=POOL.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,8)})();
function save(){try{localStorage.setItem('ecoforest',JSON.stringify({w:WEEK,d:[...done].map(i=>TASKS[i][0])}))}catch(e){}}
const TIPS=[
["Mind your water","Fixing a dripping tap can save thousands of litres a year. Check taps and toilets for slow leaks."],
["Eco-bricks lock up plastic","Packing clean soft plastic into bottles keeps it out of waterways and can be used to build garden benches."],
["Eat a little less meat","Even one or two plant-based meals a week lowers your food's carbon and water footprint."],
["Wash cold, hang dry","Most of a washing machine's energy heats the water. Cold cycles and a clothesline cut your bill and emissions."],
["Buy less, repair more","Sewing a button or fixing a zip keeps clothes out of landfill and saves the resources used to make new ones."],
["Plant for pollinators","Native flowers feed bees and butterflies. Even a balcony pot helps."],
["Shop with a list","Roughly a third of food is wasted. Planning meals means less rotting food and less methane."],
["Rinse, don't wash twice","Collect cold shower warm-up water in a bucket and use it for plants or flushing."],
["Choose lights wisely","LED bulbs use far less power than old bulbs. Switch off lights when you leave a room."],
["Walk, bike or share the ride","Short trips on foot or bike cut emissions and air pollution on your street."],
["Skip the junk mail","Unsubscribe from paper catalogues and flyers to save paper, ink and trees."],
["Say no to microplastics","Use a washing bag that catches synthetic fibres and choose natural fabrics when you can."]];
const TREES=(()=>{const r=rnd(31),a=[];let i=0;
 [[.35,13,17,.62,.78,20],[.12,9,13,.9,1.08,14],[0,3,8,1.15,1.45,9]].forEach(([h,y0,y1,s0,s1,n])=>{for(let k=0;k<n;k++)a.push({x:(k+.15+r()*.7)/n*100,y:y0+r()*(y1-y0),s:s0+r()*(s1-s0),i:i++,h,k:['oak','oak','pine','pine','birch','oak','pine'][Math.floor(r()*7)]})});return a})();
const $=id=>document.getElementById(id);
const stage=$('stage'),world=$('world'),toastEl=$('toast');
let done=new Set(),tipCount=0,order=[],tt;

function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),1800)}

function rnd(s){return()=>(s=s*16807%2147483647)/2147483647}
const BARE={t:`<g class='bare' stroke='#3b2a22' stroke-linecap='round'><path fill='none' stroke-width='3' d='M70 104Q60 82 42 66M70 104Q72 76 70 40M70 104Q82 84 100 70'/><path fill='none' stroke-width='2' d='M60 86Q52 70 40 62M72 80Q82 66 96 58M92 76Q100 64 112 62M70 70Q62 54 56 40M70 60Q80 46 86 34M52 74Q44 64 34 66'/></g>`,
 p:`<g class='bare' stroke='#3b2a22' stroke-linecap='round'><path fill='none' stroke-width='2.5' d='M70 40V138M70 62Q50 64 38 80M70 62Q90 64 102 80M70 86Q46 90 30 106M70 86Q94 90 110 106M70 110Q42 116 26 132M70 110Q98 114 114 130'/></g>`};
function treeSVG(t){
 const r=rnd(t.i*131+7),k=t.k,f=n=>n.toFixed(1);
 const bl=(n,cx,cy,rx,ry,a,b)=>{let s='';for(let i=0;i<n;i++){const an=r()*6.28,d=Math.sqrt(r());s+=`<circle cx='${f(cx+Math.cos(an)*rx*d)}' cy='${f(cy+Math.sin(an)*ry*d)}' r='${f(a+r()*b)}'/>`}return s};
 const blot=(cx,cy,rx,ry)=>`<g class='blot' filter='url(#s${t.i})'><g fill='#d6293a'>${bl(7,cx,cy,rx,ry,6,7)}</g><g fill='#8f0f24' opacity='.5'>${bl(3,cx,cy,rx*.7,ry*.7,4,5)}</g></g>`;
 let h=`<svg viewBox='0 0 140 190'><defs><filter id='s${t.i}' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='3'/></filter></defs><ellipse cx='70' cy='185' rx='40' ry='6' fill='#274d33' opacity='.3'/>`;
 if(k==='pine'){
  h+=`<rect x='66' y='138' width='8' height='48' fill='#6b4630'/><g class='canopy'>`;
  for(let j=4;j>=0;j--){const ty=8+j*24,by=ty+50,w=20+j*8;let p=`M70 ${ty}L${70+w} ${by}`;for(let q=1;q<=6;q++)p+=`L${f(70+w-q*w/3)} ${by-(q%2?7:0)}`;
   h+=`<path d='${p}Z' fill='#1f5a46'/><path d='M70 ${ty}L${70-w} ${by}L70 ${by-5}Z' fill='#3f9a6a' opacity='.55'/>`}
  h+=blot(70,70,26,50)+BARE.p+`</g>`;
 }else{
  const birch=k==='birch',c=birch?['#3d8a52','#7fc15f','#b5e07a','#dcf29a']:['#255f43','#4a9a5c','#8fcf6e','#c8ee94'];
  h+=birch?`<path d='M64 187L66 76L74 76L76 187Z' fill='#eee9dc'/><g fill='#3a3a38'><rect x='66' y='110' width='5' height='3'/><rect x='70' y='140' width='5' height='3'/><rect x='66' y='160' width='4' height='3'/></g>`
   :`<path d='M56 187Q65 176 65 150L66 100L76 100L77 150Q77 176 86 187Z' fill='#6b4630'/><path d='M66 100L70 100L70 182Q66 176 65 150Z' fill='#9a6a45' opacity='.6'/><path d='M70 125Q55 108 42 92M73 118Q90 102 100 88' stroke='#6b4630' stroke-width='5' fill='none' stroke-linecap='round'/>`;
  const rx=birch?30:48,ry=birch?38:36,cy=birch?58:64;
  h+=`<g class='canopy'><g fill='${c[0]}'>${bl(34,70,cy+8,rx,ry,5,7)}</g><g fill='${c[1]}'>${bl(36,69,cy,rx*.95,ry*.92,5,7)}</g><g fill='${c[2]}' opacity='.85'>${bl(18,62,cy-12,rx*.65,ry*.6,4,6)}</g><g fill='${c[3]}' opacity='.55'>${bl(9,58,cy-20,rx*.4,ry*.35,3,5)}</g>${blot(70,cy,rx*.8,ry*.8)}${BARE.t}</g>`;
 }
 return h+'</svg>';
}
function buildPanel(K){

 const mh=`<defs><linearGradient id='mh' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='#dff3d8' stop-opacity='0'/><stop offset='1' stop-color='#dff3d8' stop-opacity='.6'/></linearGradient></defs>`,mr=y=>`<rect x='0' y='${y}' width='1000' height='${300-y}' fill='url(#mh)'/>`;
 const mts=mk('bottom:36%;height:42%','0 0 1000 300',soft(1,150,34,'#9fd2a8','#cbe9c4',30)+mh+mr(160)+soft(2,192,30,'#7fc291','#b3dcab',70)+mr(205)+soft(3,226,24,'#68b67f','#9ed39a',130));
 const hy=(x,b,a,p)=>{x+=X0;return b+Math.sin(x/130+p)*a+Math.sin(x/57+p*2)*a*.35+Math.sin(x/290+p*.5)*a*.8};

  let pts='';for(let x=0;x<=1000;x+=10)pts+=(x?'L':'M')+x+' '+f(hy(x,b,a,p));
  let ex='';
  for(let i=0;i<7;i++){const cx=R()*1000;ex+=`<ellipse cx='${f(cx)}' cy='${f(hy(cx,b,a,p)+16+R()*40)}' rx='${f(40+R()*50)}' ry='${f(5+R()*7)}' fill='${pick(['#a8dc8c','#8fcf7e','#c4e48e'])}' opacity='.35'/>`}
  [16,32].forEach(o=>{let q='';for(let x=0;x<=1000;x+=20)q+=(x?'L':'M')+x+' '+f(hy(x,b,a,p)+o+Math.sin(x/40)*2);ex+=`<path d='${q}' stroke='#2f7a4c' stroke-width='1.2' fill='none' opacity='.14'/>`});
  for(let i=0;i<trees;i++){const x=R()*1000,y=hy(x,b,a,p)+3+R()*14,h=7+R()*7,g=pick(['#3f8f55','#4a9a5c','#2f7a4c','#58ad62']);ex+=R()<.4?`<path d='M${f(x-3.5)} ${f(y)}L${f(x)} ${f(y-h-3)}L${f(x+3.5)} ${f(y)}Z' fill='${g}'/>`:`<circle cx='${f(x)}' cy='${f(y-h*.5)}' r='${f(h*.55)}' fill='${g}'/><circle cx='${f(x-1.2)}' cy='${f(y-h*.65)}' r='${f(h*.25)}' fill='#a7df86' opacity='.4'/>`}
  for(let i=0;i<90;i++){const x=R()*1000,y=hy(x,b,a,p)+8+R()*(190-b);ex+=`<path d='M${f(x)} ${f(y)}Q${f(x+1)} ${f(y-3)} ${f(x+2)} ${f(y-6)}' stroke='${pick(['#3f8f55','#58ad62','#7bc86d'])}' stroke-width='1.2' fill='none' opacity='.55'/>`}

  {let rb='';for(let i=0;i<5;i++){const x=R()*1000;rb+=`<circle cx='${f(x)}' cy='${f(hy(x,b,a,p)+15+R()*30)}' r='${f(25+R()*30)}'/>`}ex+=`<g class='blot' filter='url(#hb)'><g fill='#d6293a'>${rb}</g></g>`}
  return `<defs><filter id='hb' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='6'/></filter><linearGradient id='hg${n}' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='${c0}'/><stop offset='1' stop-color='${c1}'/></linearGradient><clipPath id='hc${n}'><path d='${pts}L1000 200L0 200Z'/></clipPath></defs><path d='${pts}L1000 200L0 200Z' fill='url(#hg${n})'/><g clip-path='url(#hc${n})'>${ex}</g><path d='${pts}' stroke='#e2f8c8' stroke-width='1.6' fill='none' opacity='.55'/>`};

  s+=R()<.45?`<path d='M${f(x-w)} 100L${f(x)} ${f(100-h)}L${f(x+w)} 100Z' fill='${g}'/>`:`<rect x='${f(x-1.5)}' y='${f(100-h*.35)}' width='3' height='${f(h*.35)}' fill='#6b4630' opacity='.7'/><circle cx='${f(x)}' cy='${f(100-h*.55)}' r='${f(w*1.5)}' fill='${g}'/><circle cx='${f(x-w*.4)}' cy='${f(100-h*.7)}' r='${f(w*.7)}' fill='#a7df86' opacity='.35'/>`}
 const tl=mk('bottom:23%;height:22%','0 0 1000 100',`<g opacity='.95'>${s}</g>`);
 s='';
 [...Array(5)].map(()=>R()*1000).forEach(x=>{const sc=.8+R()*.6,w=34*sc,by=124;
  s+=`<ellipse cx='${f(x)}' cy='${by+4}' rx='${f(w*1.15)}' ry='6' fill='#1f4d33' opacity='.3'/>`;
  const cl=(n,cx,cy,rx,ry,r0,r1,col,op)=>{let o='';for(let i=0;i<n;i++){const an=R()*6.283,d=Math.sqrt(R());o+=`<circle cx='${f(cx+Math.cos(an)*rx*d)}' cy='${f(cy+Math.sin(an)*ry*d)}' r='${f(r0+R()*r1)}'/>`}return `<g fill='${col}' opacity='${op}'>${o}</g>`};
  s+=cl(14,x,by-12*sc,w,13*sc,7*sc,7*sc,'#245f3f',1)+cl(16,x,by-15*sc,w*.9,12*sc,6*sc,7*sc,'#357f50',1)+cl(10,x-w*.15,by-21*sc,w*.6,8*sc,5*sc,5*sc,'#58ad62',.9)+cl(6,x-w*.25,by-25*sc,w*.35,5*sc,3.5*sc,4*sc,'#a7df86',.55);

function buildScenery(){
 const defs={mts:['bottom:36%;height:42%',1000/300,3,.4],hl:['bottom:20%;height:36%',5,3,.8],tl:['bottom:23%;height:22%',10,4,1.4],gb:['bottom:0;height:26%',1000/150,4,2],fg:['bottom:0;height:14%',10,5,2.6]},P=[0,1,2,3,4].map(buildPanel);

  const [css,ar,n,K]=defs[key],lay=document.createElement('div');
  lay.className='lay';lay.style.cssText=css+(key==='fg'?';z-index:200':'');lay.dataset.k=K;

 stage.style.setProperty('--sw',stage.clientWidth+'px');

/* trees */
TREES.forEach(t=>{
  const el=document.createElement('div');el.className='tree';el.tabIndex=0;el.setAttribute('role','button');
  el.setAttribute('aria-label','Tree. Click a few times to rustle it.');
  el.style.cssText=`left:calc(${t.x}% * var(--sp,1));bottom:${t.y}%;width:calc(var(--tw,130px)*${t.s.toFixed(2)});z-index:${Math.round(1000-t.y*10)};opacity:${(1-t.h*.3).toFixed(2)};--dl:-${(Math.random()*5).toFixed(1)}s`;
  el.innerHTML=treeSVG(t);
  let n=0;
  const poke=()=>{
    el.classList.remove('rustle');void el.offsetWidth;el.classList.add('rustle');n++;
    if(n>=3){n=0;dropLeaf(el)}else toast(`Rustle… ${n}/3`);
  };
  el.onclick=poke;
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}};
  world.appendChild(el);
});

function dropLeaf(tree){
  const sr=stage.getBoundingClientRect(),tr=tree.getBoundingClientRect();
  const leaf=document.createElement('div');leaf.className='leaf';
  leaf.innerHTML='<svg viewBox="0 0 30 30"><path d="M4 26C4 11 13 4 27 3c0 14-6 22-20 22" fill="#f0a23a"/><path d="M5 25L20 10" stroke="#b86a14" stroke-width="2" fill="none"/></svg>';
  const top=tr.top-sr.top+tr.height*.3,ground=sr.height*.88;
  leaf.style.left=(tr.left-sr.left+tr.width/2-15)+'px';leaf.style.top=top+'px';leaf.style.setProperty('--d',Math.max(60,ground-top)+'px');
  stage.appendChild(leaf);toast('A leaf is falling…');
  leaf.addEventListener('animationend',()=>{leaf.remove();showTip()});
}

function showTip(){
  if(!order.length)order=TIPS.map((_,i)=>i).sort(()=>Math.random()-.5);
  const [h,p]=TIPS[order.pop()];tipCount++;$('tips').textContent='Tips found: '+tipCount;
  openModal('🍃',h,p,'Close');
}
function openModal(icon,h,p,btn){
  $('micon').textContent=icon;$('mt').textContent=h;$('mp').textContent=p;$('close').textContent=btn;
  $('modal').classList.add('on');$('close').focus();
}
function closeModal(){$('modal').classList.remove('on')}
$('close').onclick=closeModal;
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* tasks */
const list=$('tasks');
TASKS.forEach((t,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.className='task';b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="box"></span><span><b>${t[0]}</b><small>${t[1]}</small></span>`;
  b.onclick=()=>{
    const on=!done.has(i);on?done.add(i):done.delete(i);
    b.classList.toggle('done',on);b.setAttribute('aria-pressed',on);b.querySelector('.box').textContent=on?'✓':'';
    save();update(on&&done.size===TASKS.length);
  };
  li.appendChild(b);list.appendChild(li);
});

const fillEl=document.createElement('div');fillEl.className='fill';$('bar').appendChild(fillEl);
function update(win){
  const p=done.size/TASKS.length,pc=Math.round(p*100);
  stage.style.setProperty('--c',1-p);
  fillEl.style.width=(p*100)+'%';vineState();
  $('count').textContent=`${done.size} of ${TASKS.length} tasks`;
  $('status').textContent=p===0?'Red corruption is spreading. Complete tasks to fight it.':p<.5?'The corruption is fading, keep going.':p<1?'Green is returning to the grove.':'The forest is healed!';
  if(win)setTimeout(()=>openModal('🌈','The forest is healed!','Every task you did in real life makes a real difference. Keep the habits going and rustle the trees for more tips.','Keep exploring'),500);
}
$('reset').onclick=()=>{done.clear();document.querySelectorAll('.task').forEach(b=>{b.classList.remove('done');b.setAttribute('aria-pressed','false');b.querySelector('.box').textContent=''});save();update(false)};

/* scenery */
buildScenery();
setInterval(()=>{ // ambient decorative leaf
  if(document.hidden)return;const l=document.createElement('div');l.className='leaf';l.style.opacity='.7';
  l.innerHTML='<svg viewBox="0 0 30 30"><path d="M4 26C4 11 13 4 27 3c0 14-6 22-20 22" fill="#9bd56b"/></svg>';
  l.style.cssText+=`left:${Math.random()*95}%;top:-20px;width:18px;height:18px;--t:9s`;
  l.style.setProperty('--d',stage.clientHeight*.9+'px');stage.appendChild(l);setTimeout(()=>l.remove(),9100)},5000);
function vineState(){const v=$('vines');if(!v)return;const p=done.size/TASKS.length;
 v.querySelectorAll('[data-g]').forEach(e=>e.classList.toggle('gone',p>=+e.dataset.g));
 v.querySelectorAll('[data-l]').forEach(e=>e.classList.toggle('on',p>=+e.dataset.l));
 const ok=!v.querySelector('[data-g]:not(.gone)');
 v.querySelectorAll('[data-b]').forEach(e=>e.classList.toggle('bloom',ok&&p>=+e.dataset.b))}
function buildVines(){
 const W=stage.clientWidth,H=stage.clientHeight;if(!W||!H)return;
 const R=rnd(777),f=n=>n.toFixed(1),pick=a=>a[Math.floor(R()*a.length)],m=13,rad=34,P=[];
 const seg=(x0,y0,x1,y1)=>{const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/6));for(let i=0;i<n;i++)P.push([x0+(x1-x0)*i/n,y0+(y1-y0)*i/n])};
 const arc=(cx,cy,a0)=>{const n=Math.round(rad*1.57/6);for(let i=0;i<n;i++){const a=a0+1.5708*i/n;P.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad])}};
 seg(m+rad,m,W-m-rad,m);arc(W-m-rad,m+rad,-1.5708);
 seg(W-m,m+rad,W-m,H-m-rad);arc(W-m-rad,H-m-rad,0);
 seg(W-m-rad,H-m,m+rad,H-m);arc(m+rad,H-m-rad,1.5708);
 seg(m,H-m-rad,m,m+rad);arc(m+rad,m+rad,3.1416);
 const N=P.length,tn=P.map((p,i)=>{const a=P[(i+N-1)%N],b=P[(i+1)%N],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]});
 let dk='',gv='',th='',fl='',lf='';
 [1,-1].forEach((sg,si)=>{
  const pts=P.map((p,i)=>{const t=tn[i],o=sg*Math.sin(i*6/42)*4.5+Math.sin(i*6/150)*3;return[p[0]-t[1]*o,p[1]+t[0]*o]});
  const d='M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';
  dk+=`<path d='${d}' stroke='#4b1030' stroke-width='4.5' fill='none' stroke-linejoin='round'/><path d='${d}' stroke='#8a2a50' stroke-width='1' fill='none' opacity='.5'/>`;
  gv+=`<path d='${d}' stroke='#3a8550' stroke-width='4.5' fill='none' stroke-linejoin='round'/><path d='${d}' stroke='#8fd67a' stroke-width='1.2' fill='none' opacity='.6'/>`;
  for(let i=0;i<N;i++){
   const p=pts[i],t=tn[i],nx=-t[1],ny=t[0],q=(a,b)=>`${f(p[0]+nx*a+t[0]*b)} ${f(p[1]+ny*a+t[1]*b)}`;
   if((i+si*2)%4===0){const ts=(i%8<4)?4:-4;
    th+=`<path class='th' data-g='${f(.06+R()*.56)}' d='M${q(0,-3.5)}Q${q(7,0)} ${q(11,ts)}Q${q(3,ts*.7)} ${q(0,3.5)}Z' fill='#7a1232'/>`}
   if((i+si*23)%41===6){const cv=`<path d='M${q(0,0)}C${q(10,2)} ${q(17,12)} ${q(9,16)}S${q(2,10)} ${q(5,8)}' fill='none' stroke-width='1.6' stroke-linecap='round'`;dk+=cv+` stroke='#4b1030'/>`;gv+=cv+` stroke='#4fa05f'/>`}
   if((i+si*5)%9===4){const a=Math.atan2(ny,nx)*57.3+((i%2)?-35:35);
    lf+=`<g transform='translate(${f(p[0])} ${f(p[1])}) rotate(${f(a)})'><g class='lf' data-l='${f(.1+R()*.52)}'><path d='M0 0Q7 -6 17 0Q7 6 0 0Z' fill='${pick(['#4fa05f','#58ad62','#6dbb6a'])}'/><path d='M1 0H14' stroke='#2f7a4c' stroke-width='.8' opacity='.7'/></g></g>`}
   if((i+si*10)%20===3){
    const c=pick(['#fff6d6','#ffd75e','#f6a8d0','#c9b2ff','#ffffff','#ffb27a']),r=6+R()*4;let pe='';
    for(let k=0;k<5;k++){const an=k*1.2566;pe+=`<circle cx='${f(Math.cos(an)*r*.7)}' cy='${f(Math.sin(an)*r*.7)}' r='${f(r*.55)}'/>`}
    fl+=`<g transform='translate(${f(p[0]+nx*4)} ${f(p[1]+ny*4)})'><g class='fl' data-b='${f(.63+R()*.37)}'><g fill='${c}'>${pe}</g><circle r='${f(r*.35)}' fill='#ffc93c'/></g></g>`}
  }
 });
 const old=$('vines');if(old)old.remove();
 const v=document.createElement('div');v.id='vines';v.className='nt';
 v.innerHTML=`<svg viewBox='0 0 ${W} ${H}' preserveAspectRatio='none'><g class='dk'>${dk}</g><g class='gv'>${gv}</g><g>${lf}</g><g>${th}</g><g>${fl}</g></svg>`;
 stage.appendChild(v);vineState();
 requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.remove('nt')));
}
let vt;new ResizeObserver(()=>{clearTimeout(vt);vt=setTimeout(buildVines,120)}).observe(stage);buildVines();
function buildAmbience(){
 const R=rnd(2024),add=(h,css,cls,ref)=>{const d=document.createElement('div');d.className=cls;d.style.cssText=css;if(h)d.innerHTML=h;stage.insertBefore(d,ref||null);return d};
 const first=stage.querySelector('.lay');
 for(let i=0;i<5;i++)add('',`top:${50+R()*130}px;--s:${(.6+R()*.6).toFixed(2)};--d:${Math.round(90+R()*70)}s;--dl:-${Math.round(R()*120)}s`,'cloud2',first);
 add('','','gloom',first);
 first.style.filter='blur(1px) var(--fx)';
 add('','','dapple',stage.querySelector('.blight'));
 add('','','rays');add('','','vig');
 for(let i=0;i<6;i++){const c=['#ffb27a','#f6a8d0','#c9b2ff'][i%3];add(`<svg viewBox='0 0 24 20'><g fill='${c}'><g class='wl'><ellipse cx='7' cy='7' rx='7' ry='6'/><ellipse cx='8' cy='14' rx='5' ry='4' opacity='.85'/></g><g class='wr'><ellipse cx='17' cy='7' rx='7' ry='6'/><ellipse cx='16' cy='14' rx='5' ry='4' opacity='.85'/></g></g><rect x='11.2' y='3' width='1.6' height='14' rx='.8' fill='#4b3a2a'/></svg>`,'','bf')}
}
buildAmbience();
let cam=.5,camT=.5,raf=0,SW=900,TW=0;
const LAY=[...stage.querySelectorAll('.lay')].map(l=>({l,k:+l.dataset.k})),mmi=document.querySelector('.mm i');
function setCam(){const x=cam*SW;LAY.forEach(o=>o.l.style.transform=`translate3d(${(-x*o.k).toFixed(1)}px,0,0)`);world.style.transform=`translate3d(${(-2*x).toFixed(1)}px,0,0)`;mmi.style.left=(cam*74).toFixed(1)+'px'}
function navState(){$('navL').disabled=camT<=.001;$('navR').disabled=camT>=.999}
function tick(){cam+=(camT-cam)*.14;if(Math.abs(camT-cam)<.0005)cam=camT;setCam();raf=cam===camT?0:requestAnimationFrame(tick)}
function go(d){camT=Math.min(1,Math.max(0,camT+d));if(!raf)raf=requestAnimationFrame(tick);navState()}
['navL','navR'].forEach((id,i)=>{const b=$(id),d=i?.12:-.12;let iv;const stop=()=>clearInterval(iv);
 b.onpointerdown=()=>{go(d);clearInterval(iv);iv=setInterval(()=>go(d),180)};
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
 b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(d)}}});
document.addEventListener('keydown',e=>{if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!$('modal').classList.contains('on')){e.preventDefault();go(e.key==='ArrowLeft'?-.12:.12)}});
const rz=()=>{SW=stage.clientWidth;const w=Math.round(Math.max(90,Math.min(150,SW*.15)));if(w!==TW){TW=w;stage.style.setProperty('--tw',w+'px')}setCam()};
new ResizeObserver(rz).observe(stage);rz();navState();
const BF=[...document.querySelectorAll('.bf')].map((el,i)=>{world.appendChild(el);return{el,x:0,y:0,a:Math.random()*6.28,tx:0,ty:0,sp:50,ph:Math.random()*9,i}});
const aim=b=>{const W=SW*3,H=stage.clientHeight;b.tx=Math.max(60,Math.min(W-60,b.x+(Math.random()-.5)*SW*.9));b.ty=H*(.28+Math.random()*.47);b.sp=40+Math.random()*40};
BF.forEach(b=>{b.x=SW*3*(b.i+.5)/BF.length;b.y=stage.clientHeight*(.35+Math.random()*.3);aim(b)});
let bt=0;
function fly(t){const dt=Math.min(.05,(t-bt)/1000||.016);bt=t;
 BF.forEach(b=>{const dx=b.tx-b.x,dy=b.ty-b.y;if(Math.hypot(dx,dy)<26)aim(b);
  let da=Math.atan2(dy,dx)+Math.sin(t/700+b.ph)*.8-b.a;da=Math.atan2(Math.sin(da),Math.cos(da));b.a+=da*Math.min(1,dt*2.4);
  const v=b.sp*(.65+.35*Math.sin(t/430+b.ph*2));b.x+=Math.cos(b.a)*v*dt;b.y+=Math.sin(b.a)*v*dt+Math.sin(t/260+b.ph)*.3;
  b.el.style.transform=`translate3d(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px,0) rotate(${(b.a*57.3+90).toFixed(1)}deg)`});
 requestAnimationFrame(fly)}
requestAnimationFrame(fly);
setTimeout(()=>toast('Use ← → to explore the forest'),700);
const scene=document.querySelector('.scene'),tab=$('tab');
function setBoard(open){scene.classList.toggle('closed',!open);tab.textContent=open?'Hide tasks':'Show tasks';tab.setAttribute('aria-expanded',open)}
tab.onclick=()=>setBoard(scene.classList.contains('closed'));
setBoard(innerWidth>820);
try{const sv=JSON.parse(localStorage.getItem('ecoforest')||'null');
 if(sv&&sv.w===WEEK)document.querySelectorAll('.task').forEach((b,i)=>{if(sv.d.includes(TASKS[i][0])){done.add(i);b.classList.add('done');b.setAttribute('aria-pressed','true');b.querySelector('.box').textContent='✓'}})}catch(e){}
const dl=(8-new Date().getDay())%7||7;
$('wk').textContent=`New tasks every Monday · ${dl} day${dl>1?'s':''} left`;
update(false);
setInterval(()=>{if(weekId()!==WEEK)location.reload()},60000);
</script>
